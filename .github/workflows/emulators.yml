# Prueba de humo en emuladores de varias versiones de Android:
# instala el APK, abre la app, verifica que no se cierre sola y guarda una captura de pantalla.
name: Probar en emuladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleDebug

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar y abrir en Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 34 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh ${{ matrix.api-level }}

      - name: Subir capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-api-${{ matrix.api-level }}
          path: smoke/
